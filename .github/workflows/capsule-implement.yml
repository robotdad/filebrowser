# ============================================================================
# ADAPTED VARIANT: Route 1 (GitHub Actions drives the backend). Compute runs on the
# hosted compute backend via a bearer-token submit (submit_compute.py),
# NOT the in-runner attractor engine. task-runner.dot runs in the backend clone;
# its fix is exported as a diff, re-applied here, and pushed by the existing PR
# step. Design + auth + first-run risks: docs/designs/gh-actions-hosted-compute.md.
# The upstream in-runner-engine rationale below is retained for reference.
# ============================================================================
# Capsule Implement -- the "implement" stage of an issue -> attractor -> PR
# system. See .github/capsule-pipeline/README.md for what this is and why
# the vendored files under that directory exist.
#
# TRIGGER DESIGN (per DESIGN-issue-to-attractor-pipeline.md section 2/5:
# "labels are an index, the capsule PR is the transaction"):
#
#   Real trigger = a human MERGES a capsule PR (pull_request: closed,
#   merged == true, scoped to the proposals/ path). This is the design's
#   second human gate. Options considered and rejected:
#     - A `ready:build` LABEL: rejected for the same reason v0.1's label-
#       as-state-store was rejected in the design doc section 5 -- "a
#       label is a claim by construction... no provenance, no run ID; you
#       cannot distinguish 'never ran' from 'ran and failed' from 'someone
#       removed it.'" Adding a second label just to re-derive a signal the
#       merge event for the SAME PR already carries atomically is pure
#       overhead with none of the merge event's benefits (attribution,
#       diff, revertability).
#     - workflow_dispatch ONLY: loses the automatic hand-off entirely --
#       a human would have to remember to go run something after merging,
#       defeating the point of "merge IS the yes-build-this signal."
#   workflow_dispatch is KEPT as the manual re-run / pre-merge-testing
#   path (same rationale as capsule-specify.yml's own workflow_dispatch
#   input) -- it takes a capsule_path directly, since a manual invocation
#   has no merged PR to read files from.
#
#   PRE-MERGE PROOF NOTE: `issues`/`workflow_dispatch` triggers are only
#   ever evaluated by GitHub Actions against the workflow file on the
#   DEFAULT branch (confirmed empirically by this repo's own
#   capsule-specify.yml history -- see commits e2b4206/71e6c4c on the
#   branch that introduced it). `pull_request` is the one trigger GitHub
#   evaluates using the PR branch's OWN copy of a workflow file, so this
#   repo's established pattern for proving a brand-new workflow before
#   merge is a TEMPORARY `pull_request: [opened, synchronize]` trigger,
#   exercised for real once, then reverted in a follow-up commit before
#   the PR is left for review. If this file's git history shows such a
#   temporary trigger, it means the current run being pointed to as proof
#   used that equivalent path, NOT the real merged-PR event (which cannot
#   fire until a capsule PR is actually merged) -- see the PR body / final
#   report for which path was actually exercised for the proof run.
#
# IDEMPOTENCY: a capsule is uniquely identified by (issue number, capsule
# id) -- both derived from the proposal directory naming convention
# `.github/capsule-pipeline/proposals/issue-<N>/<id>.md` that
# capsule-specify.yml itself established. This workflow computes a
# deterministic branch name `implement/issue-<N>-<id>` and refuses to
# re-run task-runner.dot (an expensive, multi-hour operation) if that
# branch already exists on the remote -- covering "merge event fires
# twice", "someone re-dispatches manually after a prior success", and
# "someone re-dispatches while a prior run is still in flight" (the last
# one is also covered by `concurrency:` below). A maintainer who genuinely
# wants to force a rebuild deletes the branch (or dispatches a differently
# -named capsule) -- there is no separate force-rebuild input, on purpose:
# a silent "just re-run it" button for a multi-hour, real-money LLM job is
# not something to make one flag away.
#
# HUMAN ABORT: `concurrency: cancel-in-progress: false` means a NEW
# trigger for a DIFFERENT capsule queues behind an in-flight run rather
# than cancelling it (killing a multi-hour convergence run to service an
# unrelated event would waste all its progress) -- but this does NOT
# remove the ability to abort. GitHub's own workflow cancellation (Actions
# tab "Cancel workflow", or `gh run cancel <run-id>`) always works
# regardless of `concurrency:` settings, and is the abort mechanism for a
# run that is visibly going wrong. A finer-grained "check a `halt` label
# between iterations" mechanism is named as future work in the design doc
# (section 8, item 9) but is NOT implemented here: task-runner.dot itself
# has no such check today, and adding one would be an engine change, which
# this workflow deliberately avoids (see the vendored task-runner.dot's
# own provenance header for the one invocation gap that WAS worth a
# workflow-level fix, and why this one isn't handled the same way).
#
# KNOWN, NAMED GAP (not fixed here): task-runner.dot's first deterministic
# check after the maker's first `attempt` is `verify` -- there is no
# pre-attempt re-check of whether the gate is ALREADY green at the current
# HEAD (the "stale gate" scenario named in the design doc section 6: main
# moved and the defect got fixed by something unrelated between specify
# and implement). A run against an already-green gate will simply have
# `attempt` do a near-no-op and `verify` pass immediately -- not corrupted,
# but also not the `resolved-elsewhere` terminal state the design
# document names. Flagged here rather than silently patched into the
# vendored engine.
#
# Job cannot join "CI Gate (all checks passed)" (.github/workflows/ci.yml):
# that aggregate's `needs:` list only ever names job IDs defined inside
# ci.yml itself, so a job in this separate workflow file cannot be added to
# it by accident (same isolation capsule-specify.yml already relies on). A
# failed implement run is real, useful information and is allowed to leave
# this job (and only this job) red.
name: Capsule Implement

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - ".github/capsule-pipeline/proposals/**"
  workflow_dispatch:
    inputs:
      capsule_path:
        description: "Repo-relative path to a capsule .md file to implement (e.g. .github/capsule-pipeline/proposals/issue-144/prefix-sharing-substitution-corruption.md)"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

# Keyed to the capsule being implemented (merged-PR number, or the
# dispatched capsule path), not to the whole workflow -- two DIFFERENT
# capsules can implement concurrently; the SAME capsule cannot pile up
# concurrent runs. cancel-in-progress: false per the design doc section 5
# ("cancelling a 4h run to service a label event is catastrophic") -- see
# the HUMAN ABORT note above for how a human actually stops a bad run.
concurrency:
  group: capsule-implement-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.capsule_path }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: "Run task-runner.dot (implement stage)"
    runs-on: ubuntu-latest
    # task-runner.dot's own max_pipeline_duration=14400s (4h) is the
    # engine's internal wall; the
    # job wall must clear that plus setup/critique/PR-creation overhead,
    # while staying comfortably under GitHub Actions' 6h hard cap for
    # hosted runners -- same ratio-of-buffer reasoning as
    # capsule-specify.yml's 90min-over-a-60min-engine-wall.
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Locate and validate the capsule
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CAPSULE_MD="${{ inputs.capsule_path }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            # Enumerate the merged PR's changed files via the PR files API --
            # merge-strategy-independent (identical result for rebase, squash,
            # and merge-commit merges; no git-range arithmetic against main).
            # --paginate clears the per-page cap so a large PR cannot silently
            # truncate the list. Removed files are excluded: a deletion is not
            # a capsule to implement.
            CHANGED_FILES="$(gh api --paginate \
              "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" \
              --jq '.[] | select(.status != "removed") | .filename')"

            # A capsule PR ships supporting artifacts NEXT TO the capsule in
            # the same proposal dir (<id>.discrimination.md, <id>.hypothesis.patch,
            # <id>.base-sha, ...), so "any .md under proposals/" is AMBIGUOUS.
            # The previous `... | head -1` silently guessed the alphabetically
            # first .md and picked <id>.discrimination.md over <id>.md the very
            # first time the production trigger fired (PR #171, run 31329562759).
            # The capsule is structurally identifiable instead: it is the one
            # .md whose sibling <id>.verify.sh is in the SAME changed-file set
            # -- a pairing the specify stage's package step guarantees. Zero or
            # multiple such pairs is refused loudly, never guessed.
            MD_CANDIDATES="$(printf '%s\n' "$CHANGED_FILES" \
              | grep -E '^\.github/capsule-pipeline/proposals/issue-[0-9]+/[^/]+\.md$' || true)"
            CAPSULE_MD=""
            PAIRED_COUNT=0
            while IFS= read -r md; do
              [ -n "$md" ] || continue
              if printf '%s\n' "$CHANGED_FILES" | grep -qxF "${md%.md}.verify.sh"; then
                CAPSULE_MD="$md"
                PAIRED_COUNT=$((PAIRED_COUNT + 1))
              fi
            done <<< "$MD_CANDIDATES"

            CANDIDATES_ONE_LINE="$(printf '%s' "${MD_CANDIDATES:-none}" | tr '\n' ' ')"
            if [ "$PAIRED_COUNT" -eq 0 ]; then
              echo "::error::Merged PR #$PR_NUMBER touched .github/capsule-pipeline/proposals/** but no capsule (<id>.md with its sibling <id>.verify.sh in the same PR) was found among its changed files -- refusing to guess. .md candidates seen: $CANDIDATES_ONE_LINE" >&2
              exit 1
            fi
            if [ "$PAIRED_COUNT" -gt 1 ]; then
              echo "::error::Merged PR #$PR_NUMBER contains $PAIRED_COUNT capsule (<id>.md + <id>.verify.sh) pairs -- one capsule per capsule PR; refusing to guess which one to implement. .md candidates seen: $CANDIDATES_ONE_LINE" >&2
              exit 1
            fi
          fi

          if [ ! -f "$CAPSULE_MD" ]; then
            echo "::error::Capsule file not found at '$CAPSULE_MD' (checked out at main HEAD)." >&2
            exit 1
          fi

          ISSUE_NUMBER="$(printf '%s' "$CAPSULE_MD" | grep -oE 'issue-[0-9]+' | grep -oE '[0-9]+' | head -1 || true)"
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "::error::Could not derive an issue number from capsule path '$CAPSULE_MD' (expected .../proposals/issue-<N>/...)." >&2
            exit 1
          fi

          CAPSULE_ID="$(basename "$CAPSULE_MD" .md)"
          VERIFY_SH="$(dirname "$CAPSULE_MD")/$CAPSULE_ID.verify.sh"
          if [ ! -f "$VERIFY_SH" ]; then
            echo "::error::Expected sibling gate script not found: $VERIFY_SH" >&2
            exit 1
          fi

          IMPLEMENT_BRANCH="implement/issue-${ISSUE_NUMBER}-${CAPSULE_ID}"

          SKIP=false
          if git ls-remote --exit-code --heads origin "$IMPLEMENT_BRANCH" >/dev/null 2>&1; then
            SKIP=true
            echo "Branch $IMPLEMENT_BRANCH already exists on origin -- this capsule has already been (or is already being) implemented. Skipping the run (idempotency)."
          fi

          {
            echo "capsule_md=$CAPSULE_MD"
            echo "capsule_id=$CAPSULE_ID"
            echo "verify_sh=$VERIFY_SH"
            echo "issue_number=$ISSUE_NUMBER"
            echo "implement_branch=$IMPLEMENT_BRANCH"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"

      - name: Configure commit identity for the run
        if: steps.locate.outputs.skip != 'true'
        # task-runner.dot's `package` node commits the fix itself (an LLM
        # box node, not workflow glue) -- it is instructed to add the
        # standard Amplifier co-authored-by trailer, but does not pin an
        # author identity. Setting it globally here means that commit
        # inherits it, same as any other commit made in this job.
        #
        # Pin the pipeline's own bot identity (matches the microsoft-amplifier
        # co-author trailer the specify stage's engine already emits) so the
        # applied fix commit is attributed to the pipeline, not a human.
        run: |
          git config --global user.name "Amplifier"
          git config --global user.email "240397093+microsoft-amplifier@users.noreply.github.com"

      - name: Submit task-runner.dot to the backend (implement stage)
        id: run
        if: steps.locate.outputs.skip != 'true'
        # Compute runs on the backend, not in this runner. task-runner.dot commits its
        # fix to a local task/<id> branch INSIDE the backend clone (it does not push);
        # the shim's Export node writes that change as fix.diff to capsule_out, which
        # a later step re-applies into this checkout so the existing push/PR step runs
        # unchanged. Provider mounting is the hosted resolver's concern (no keys here).
        continue-on-error: true
        env:
          COMPUTE_URL: ${{ secrets.COMPUTE_URL }}
          COMPUTE_TOKEN: ${{ secrets.COMPUTE_TOKEN }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/capsule-implement/out"
          mkdir -p "$OUT" "$RUNNER_TEMP/capsule-implement/logs" "$RUNNER_TEMP/capsule-implement-submit"
          BASE_SHA="$(git rev-parse HEAD)"

          SHIM=".github/capsule-pipeline/shim-implement.dot"
          jq -n \
            --rawfile dot "$SHIM" \
            --arg repo "${{ github.repository }}" \
            --arg base "$BASE_SHA" \
            --arg task "${{ steps.locate.outputs.capsule_md }}" \
            '{
              dot_content: $dot,
              workspace_repo: $repo,
              base_sha: $base,
              target_dir: "/project/workspace",
              task_file: ("/project/workspace/" + $task),
              capsule_out: "/project/.resolve/data/capsule",
              max_iterations: "6"
            }' > "$RUNNER_TEMP/capsule-implement-submit/params.json"

          python3 .github/capsule-pipeline/submit_compute.py \
            --params-file "$RUNNER_TEMP/capsule-implement-submit/params.json" \
            --out "$OUT" \
            --meta-dir "$RUNNER_TEMP/capsule-implement-submit/meta" \
            --data-subpath capsule \
            --gate-answer A \
            --timeout 21600
          rc=$?

          # Classify (next step) reads logs/checkpoint.json context.outcome. task-runner.dot
          # uses outcome=success/fail; synthesize it from the retrieved SHIPPED.md so the
          # existing exit-code-vs-recorded-outcome cross-check works unchanged.
          if [ -s "$OUT/SHIPPED.md" ]; then OUTCOME=success; else OUTCOME=fail; fi
          python3 - "$RUNNER_TEMP/capsule-implement/logs/checkpoint.json" "$OUTCOME" <<'PY'
          import json, os, sys
          p, outcome = sys.argv[1], sys.argv[2]
          os.makedirs(os.path.dirname(p), exist_ok=True)
          json.dump({"context": {"outcome": outcome}}, open(p, "w"))
          PY
          echo "attractor_exit=$rc" >> "$GITHUB_OUTPUT"

      - name: "Classify the run: exit code AND the pipeline's own recorded outcome"
        id: classify
        # WHY THIS EXISTS (run 31789137305). Every classifier downstream in
        # this job -- the PR title/body, the issue comment, the job's own
        # pass/fail -- branched on `steps.run.outputs.attractor_exit` and
        # nothing else. That one value cannot carry the truth:
        #
        #   * The run step's script executes under the runner's default
        #     `bash -e`, so when the engine exits non-zero the script aborts
        #     BEFORE `echo "attractor_exit=$?"`. The output is never written.
        #     `attractor_exit` is therefore only ever '0' or ABSENT -- a real
        #     non-zero code can never reach it. That run's own job annotation
        #     is the proof: "task-runner.dot did not converge (exit=)".
        #   * GitHub coerces a missing output to 0 in an `== '0'` comparison,
        #     so ABSENT and CONVERGED are indistinguishable to an `if:`.
        #
        # The pipeline records its own verdict independently, in the logs
        # root the run step already passes as --logs-root: checkpoint.json's
        # `context.outcome`, written by the engine after EVERY node
        # (loop-pipeline engine.py: `ctx.set("outcome", outcome.status.value)`).
        # In run 31789137305 that file said `"outcome": "fail"` while this
        # job was still deciding whether to ship a fix PR.
        #
        # So the done path now requires BOTH: a literal exit 0 AND a recorded
        # outcome that is not 'fail'. Anything else routes to the
        # non-convergence path. This is a CROSS-CHECK, not a replacement --
        # the porcelain guard in the next step is untouched and remains the
        # last word on whether a tree may be pushed (in that run it was the
        # correct actor, and it is the reason nothing unproven shipped).
        #
        # Deliberately placed BEFORE the scrub step, so it reads the
        # pipeline's own bytes before anything else rewrites them.
        if: always() && steps.locate.outputs.skip != 'true'
        env:
          ATTRACTOR_EXIT: ${{ steps.run.outputs.attractor_exit }}
        run: |
          set -euo pipefail
          CHECKPOINT="$RUNNER_TEMP/capsule-implement/logs/checkpoint.json"

          RECORDED="absent"
          if [ -f "$CHECKPOINT" ]; then
            RECORDED="$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print((d.get('context') or {}).get('outcome') or 'absent')" "$CHECKPOINT" 2>/dev/null || echo unreadable)"
          fi
          # The value is engine-written; keep it to a single harmless token so
          # it can never inject extra lines into $GITHUB_OUTPUT.
          RECORDED="$(printf '%s' "$RECORDED" | tr -cd 'A-Za-z0-9_.-' | cut -c1-32)"
          RECORDED="${RECORDED:-absent}"

          EXIT="${ATTRACTOR_EXIT:-}"
          CONVERGED=false
          if [ "$EXIT" = "0" ] && [ "$RECORDED" != "fail" ]; then
            CONVERGED=true
          fi

          if [ "$EXIT" = "0" ] && [ "$RECORDED" = "fail" ]; then
            echo "::warning::ENGINE MISREPORT (exit code vs the pipeline's own recorded outcome): the run reported exit 0 while its checkpoint.json recorded outcome='fail' ($CHECKPOINT). The exit code is NOT trusted here -- this run is classified NON-CONVERGED and routed to the work-in-progress path, so none of the converged template's gate/critique claims are made for it. Incident record for this lane's non-convergence handling: #220 (run 31789137305)."
          fi

          {
            echo "recorded_outcome=$RECORDED"
            echo "converged=$CONVERGED"
          } >> "$GITHUB_OUTPUT"
          echo "classification: attractor_exit='$EXIT' recorded_outcome='$RECORDED' converged=$CONVERGED"

      - name: Scrub secrets from run evidence
        # SECURITY (incident, 2026-08): a worker agent dumped its
        # environment mid-run; the session-observability persister wrote
        # the tool:post payload VERBATIM into .ai/**/events.jsonl --
        # including a literal OPENAI_API_KEY value -- and this workflow
        # uploaded .ai as a public artifact. GitHub's live-log secret
        # masking does NOT touch files written to disk, so the artifact
        # carried the real key. This step redacts secret-shaped material
        # IN PLACE across the evidence roots (known token shapes,
        # NAME=value secret assignments, and the literal values of the
        # secrets this job actually holds -- which is why they are passed
        # into the env here: the script matches their VALUES, it never
        # prints them). Runs immediately after the pipeline so every later
        # consumer of this evidence -- the postmortem quoted onto the
        # public issue below, and the artifact upload -- sees only
        # scrubbed content. The upload is additionally gated by the
        # residual scan step before the upload step (defense in depth --
        # scrub is best-effort cleaning; the scan is the guarantee).
        if: always() && steps.locate.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAPSULE_PR_TOKEN: ${{ secrets.CAPSULE_PR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/capsule-pipeline/scrub_secrets.py scrub \
            "$RUNNER_TEMP/capsule-implement" \
            "$GITHUB_WORKSPACE/.ai"

      - name: Apply the backend-produced fix into the workspace
        id: apply
        if: steps.locate.outputs.skip != 'true' && steps.run.outputs.attractor_exit == '0' && steps.classify.outputs.converged == 'true'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/capsule-implement/out"
          DIFF="$OUT/fix.diff"
          cd "$GITHUB_WORKSPACE"
          if [ ! -s "$DIFF" ]; then
            echo "::error::converged run but no fix.diff at $DIFF -- nothing to apply."
            exit 1
          fi
          # Re-apply the diff task-runner.dot produced on its in-clone task/<id> branch.
          # The existing "Push fix branch and open PR" step then runs unchanged against
          # this now-populated tree. Commit identity comes from the kept
          # "Configure commit identity for the run" step.
          git apply --index --whitespace=nowarn "$DIFF"
          git commit \
            -m "implement: ${{ steps.locate.outputs.capsule_id }} (via the backend)" \
            -m "Applied from task-runner.dot on the backend (instance $(cat "$RUNNER_TEMP/capsule-implement-submit/meta/instance_id.txt" 2>/dev/null)); fix retrieved from capsule_out."

      - name: Push fix branch and open PR
        id: pr
        # LOAD-BEARING, AND FRAGILE ON PURPOSE -- READ BEFORE "FIXING" THE
        # EXIT CAPTURE (issue #220 salvage, both layers).
        #
        # This `if:` is the ONLY door the salvage paths have. A non-converged
        # run reaches this step exclusively through GitHub's absent-output
        # coercion: the run step above executes under `set -uo pipefail` with
        # `bash -e` semantics, so when the engine exits non-zero the step
        # ABORTS BEFORE its `echo "attractor_exit=$?" >> "$GITHUB_OUTPUT"`
        # line runs at all. The output is therefore never written, and GitHub
        # coerces a missing output to '0' in an `== '0'` comparison -- which
        # is precisely why the non-converged path gets in here to salvage and
        # push. (The `classify` step above exists because that same coercion
        # makes ABSENT and CONVERGED indistinguishable to an `if:`; it
        # recovers the truth from checkpoint.json and everything below
        # branches on `steps.classify.outputs.converged`, not on this value.)
        #
        # CONSEQUENCE: if anyone ever makes the run step record
        # attractor_exit=1 RELIABLY -- an `|| true`, a `set +e`, an explicit
        # capture into a variable, a composite action -- this condition goes
        # FALSE on exactly the runs salvage exists for, this step is skipped,
        # and BOTH salvage layers' commits (task-runner.dot's own `salvage`
        # node and this step's own Layer-2 commit) strand on a runner that is
        # about to be destroyed. That is the #220 bug again, reintroduced by a
        # change that looks like an unambiguous improvement.
        #
        # If you fix the exit capture, you MUST widen this condition in the
        # same commit -- e.g. gate on `steps.locate.outputs.skip != 'true'`
        # alone and let the `classify` step's `converged` output (already the
        # sole classifier below) decide converged-vs-salvage. Do not change one
        # without the other.
        if: always() && steps.locate.outputs.skip != 'true' && steps.run.outputs.attractor_exit == '0'
        # See capsule-specify.yml's "Open capsule PR" step for the
        # confirmed platform limitation this token falls back around:
        # `gh pr create` fails with "GitHub Actions is not permitted to
        # create or approve pull requests" under github.token alone on
        # this org/enterprise. CAPSULE_PR_TOKEN is the proven fine-grained
        # PAT that unblocks it.
        env:
          GH_TOKEN: ${{ secrets.CAPSULE_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          BRANCH="${{ steps.locate.outputs.implement_branch }}"
          ISSUE="${{ steps.locate.outputs.issue_number }}"
          CAPSULE_ID="${{ steps.locate.outputs.capsule_id }}"

          # WORK DURABILITY, LAYER 2 (issue #220). The converged and the
          # non-converged paths reach this step for opposite reasons, and a
          # single porcelain rule served one of them and destroyed the other.
          #
          # CONVERGED: unchanged, and deliberately so. task-runner.dot's own
          # ship_check gate already asserts a clean tree (no tracked .ai/
          # leakage, no stray porcelain) before reaching `done`; this second,
          # independent check costs nothing and this push must start from a
          # genuinely proven tree. That guard is load-bearing -- in run
          # 31789137305 it was the CORRECT actor and the reason nothing
          # unproven shipped. It is not weakened, relaxed, or bypassed below.
          #
          # NON-CONVERGED: this branch already opens a work-in-progress PR that
          # claims no gate and no critique, precisely so a non-converging run's
          # work "is not lost". Refusing it for being dirty is what actually
          # lost it: in run 31789137305 this guard printed eight files of
          # finished, gate-GREEN work by name and then the runner was torn down
          # with all of it still uncommitted. So on THIS path an uncommitted
          # tree is committed rather than refused.
          #
          # Layer 1 is the engine's own `salvage` node, which now commits the
          # tree on every non-shipping route into its human gate, so on the
          # ordinary non-convergence path this block finds nothing left to do.
          # Layer 2 exists because the engine can die BEFORE that node runs at
          # all -- a crash in the maker/critic lane, the step timeout, an OOM
          # kill -- and the two layers are independent on purpose.
          CONVERGED="${{ steps.classify.outputs.converged }}"
          SALVAGE_NOTE="task-runner.dot's own \`salvage\` node had already committed the run's tree (or there was nothing outside \`.ai/\` to commit); this workflow added no commit of its own."
          DIRTY="$(git status --porcelain | grep -v -E '^\?\? \.ai' || true)"
          if [ -n "$DIRTY" ]; then
            if [ "$CONVERGED" = "true" ]; then
              echo "::error::Workspace has unexpected changes outside .ai/ after a 'done' run -- refusing to push an unproven tree." >&2
              git status --porcelain >&2 || true
              exit 1
            fi
            echo "::warning::Non-converged run left an uncommitted tree that task-runner.dot's own salvage node did not capture -- committing it here so the work is not discarded (issue #220). This is work-in-progress, not a proven fix."
            git status --porcelain >&2 || true
            # .ai/ is run EVIDENCE, not product: it ships as an uploaded
            # artifact, never as a commit. Belt and braces, same as the engine
            # node -- write the repo's own exclude convention BEFORE staging,
            # then unstage .ai outright in case a worker had already git-added
            # it (the tracked-.ai leak channel ship_check guards).
            EXCLUDE="$(git rev-parse --git-common-dir)/info/exclude"
            mkdir -p "$(dirname "$EXCLUDE")"
            grep -qxF '.ai/' "$EXCLUDE" 2>/dev/null || printf '.ai/\n' >> "$EXCLUDE"
            git add -A
            if [ -n "$(git ls-files -- .ai)" ]; then git reset -q -- .ai; fi
            if git diff --cached --quiet; then
              SALVAGE_NOTE="The tree was dirty only under \`.ai/\` (run evidence), so nothing was committed by this workflow."
            else
              git commit -q \
                -m "salvage(workflow): non-converged implement run WIP for #${ISSUE}" \
                -m "task-runner.dot did not converge and left this tree uncommitted -- committed by capsule-implement.yml so the work survives the runner (issue #220). NOT a proven fix: none of the converged path's gate or critique claims apply. Run evidence is in the workflow run's uploaded artifacts."
              SALVAGE_NOTE="The engine did not reach its own \`salvage\` node, so THIS WORKFLOW committed the uncommitted tree as \`$(git rev-parse --short HEAD)\` -- see the \`salvage(workflow):\` commit on this branch."
              echo "workflow-level salvage commit: $(git rev-parse --short HEAD)"
            fi
            # Re-assert the invariant the converged guard asserts: whichever
            # branch ran, nothing outside .ai/ may remain uncommitted at push.
            if [ -n "$(git status --porcelain | grep -v -E '^\?\? \.ai' || true)" ]; then
              echo "::error::Workspace is STILL dirty outside .ai/ after the work-in-progress salvage commit -- refusing to push a tree this step cannot account for." >&2
              git status --porcelain >&2 || true
              exit 1
            fi
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            if [ "$CONVERGED" = "true" ]; then
              echo "::error::task-runner.dot reported success but HEAD matches origin/main -- no fix was actually committed. Refusing to open an empty PR." >&2
              exit 1
            fi
            # Honest non-event, not a failure of this step: the run genuinely
            # produced nothing. The job is still failed for non-convergence by
            # the final step, and the issue comment still carries the
            # postmortem -- there is simply no branch worth pushing.
            echo "::warning::Non-converged run produced nothing to salvage: HEAD matches origin/main and the tree is clean outside .ai/. No work-in-progress PR is opened, because there is no work to put in one."
            exit 0
          fi

          # SECRET SCAN GATE ON THE PUSH -- the guarantee this egress never had.
          #
          # Everything above this line can put WORKER-WRITTEN bytes onto a
          # commit that the next line makes PUBLIC, and on the salvage paths
          # those bytes passed no critic, no gate and no human: task-runner.dot's
          # own `salvage` node commits the dirty tree on its non-shipping doors
          # (Layer 1), and the block above commits whatever the engine died
          # before capturing (Layer 2). The converged path is not exempt either
          # -- ship_check proves the tree is CLEAN and GATE-GREEN, which is a
          # different claim from "contains no credential"; that push has always
          # been unscanned too, and closing it here costs nothing.
          #
          # This is not hypothetical for this repo. The scrub step above exists
          # because a worker agent dumped its environment mid-run and a literal
          # OPENAI_API_KEY landed in worker-written files on disk (2026-08
          # incident); GitHub's live-log masking does not touch bytes on disk.
          # The run-evidence artifact got BOTH a scrub and a scan out of that
          # incident. A pushed branch is at least as public as an artifact and
          # cannot be un-pushed the same way -- yet it had NEITHER. Per this
          # workflow's own doctrine (see the scrub step's comment above): scrub
          # is best-effort cleaning, the scan is the GUARANTEE. Here is the
          # guarantee.
          #
          # Fail-closed: any finding means no push, a red job, and a refusal
          # that names the offending files. `scan` prints file:line:shape and
          # NEVER the matched value (scrub_secrets.py's scan_text returns shapes
          # and variable names only), so the refusal is safe in a public log.
          #
          # ARGUMENT PLUMBING, deliberately:
          #   -z                NUL-separated, UNQUOTED paths. A bare
          #                     --name-only would let a filename containing a
          #                     space split into two bogus roots, and would
          #                     C-quote non-ASCII names into paths that do not
          #                     exist. Paired with `xargs -0`.
          #   --diff-filter=d   drop DELETED paths -- they are not in the
          #                     worktree, so there are no bytes there to scan.
          #   xargs -r          an empty diff runs the scanner ZERO times rather
          #                     than invoking it with no roots (argparse requires
          #                     at least one and would exit non-zero, turning
          #                     "nothing changed" into a false refusal).
          # `origin/main HEAD` is two-dot on purpose (the same idiom as the
          # GATE_CHANGED measurement below). If main moved during the run this
          # over-scans by the few files main gained -- over-scanning is the
          # fail-closed direction, and this checkout was taken from origin/main
          # at job start, so in practice the two-dot and three-dot sets agree.
          PUSH_SCAN_LOG="$(mktemp)"
          if git diff --name-only --diff-filter=d -z origin/main HEAD \
              | xargs -0 -r python3 .github/capsule-pipeline/scrub_secrets.py scan \
              > "$PUSH_SCAN_LOG" 2>&1; then
            cat "$PUSH_SCAN_LOG"
            echo "push secret gate: clean -- every file this push adds or changes relative to origin/main was scanned, and nothing secret-shaped was found."
          else
            cat "$PUSH_SCAN_LOG" >&2
            SCAN_FILES="$(sed -n 's/^scan FINDING //p' "$PUSH_SCAN_LOG" \
              | sed -e 's/:[0-9][0-9]*: shape=.*$//' -e 's/: unreadable .*$//' \
              | sort -u | tr '\n' ' ' || true)"
            echo "::error::The push secret gate BLOCKED this branch -- secret-shaped material was found in the bytes this job was about to push to the public branch '$BRANCH'. NOTHING WAS PUSHED and no PR was opened. Offending file(s): ${SCAN_FILES:-see the scan findings above}. The findings above give file:line:shape; the values themselves are never printed. This gate covers both salvage layers (task-runner.dot's own \`salvage\` commit and this workflow's Layer-2 commit) and the converged path -- salvaged work is UNREVIEWED by construction, so it is scanned before it can leave the runner. Rotate any credential these findings implicate, then clean the tree before re-running." >&2
            exit 1
          fi

          git push origin "HEAD:refs/heads/$BRANCH"

          # Dual-family critique is unconditional as of issue #155's fix --
          # the preflight step earlier in this job already refused to start
          # the run at all if OPENAI_API_KEY were missing, so reaching this
          # point means both critics genuinely ran cross-provider. No
          # degraded-single-family fallback message exists any more.
          DUAL_NOTE="Both reviewers ran as independent, cross-provider critics (Anthropic + OpenAI) -- enforced by this workflow's preflight check, not merely hoped for."

          # MEASURE the gate-modification claim instead of asserting it.
          # Run 31335891096 / PR #178: the previous template asserted the
          # gate was "unmodified" while that very PR edited the gate's
          # verify.sh (a REPO_ROOT path line). Never assert what isn't
          # checked -- diff the proposal dir (capsule .md, verify.sh, and
          # sibling artifacts) against the base this run started from and
          # state the measured result either way.
          PROPOSAL_DIR="$(dirname "${{ steps.locate.outputs.capsule_md }}")"
          GATE_CHANGED="$(git diff --name-only origin/main HEAD -- "$PROPOSAL_DIR")"
          if [ -z "$GATE_CHANGED" ]; then
            GATE_NOTE="Gate files unmodified -- measured: \`git diff --name-only origin/main HEAD -- ${PROPOSAL_DIR}\` is empty."
          else
            GATE_CHANGED_ONE_LINE="$(printf '%s' "$GATE_CHANGED" | tr '\n' ' ')"
            GATE_NOTE="Gate files MODIFIED by this PR (measured): ${GATE_CHANGED_ONE_LINE} -- review the gate diff alongside the fix; a gate edit changes what \"passed\" means."
          fi

          # CONVERGED distinguishes the two ways this step is reached (see
          # this step's \`if:\`), and it is deliberately NOT the exit code
          # alone. An exit code of '0' is reachable two ways: the engine
          # genuinely converged, or the run step aborted under the runner's
          # default \`bash -e\` before \`echo attractor_exit=$?\` ever wrote
          # the output, and GitHub's expression rules coerced the missing
          # value to 0 -- which is how this step is reached on the
          # non-convergence path at all. The "Classify the run" step above
          # therefore cross-checks that exit code against the pipeline's OWN
          # recorded outcome (checkpoint.json), and only 'true' here means
          # genuinely converged. The PR body must say which of the two this
          # is: run 31335891096 shipped a salvage PR (#178) wearing the
          # converged template's claims, and run 31789137305 reached this
          # step with an exit code that said nothing at all.
          CONVERGED="${{ steps.classify.outputs.converged }}"
          RECORDED_OUTCOME="${{ steps.classify.outputs.recorded_outcome }}"
          EXIT_RAW="${{ steps.run.outputs.attractor_exit }}"

          BODY_FILE="$RUNNER_TEMP/capsule-implement/pr-body.md"
          if [ "$CONVERGED" = "true" ]; then
            TITLE="implement: fix for #${ISSUE} (${CAPSULE_ID})"
            {
              echo "## Implement-stage fix for #${ISSUE}"
              echo
              echo "Refs #${ISSUE}. Produced by \`task-runner.dot\` (see \`.github/capsule-pipeline/\`)"
              echo "converging against the capsule's own definition of done and gate:"
              echo "\`.github/capsule-pipeline/proposals/issue-${ISSUE}/${CAPSULE_ID}.md\` /"
              echo "\`${CAPSULE_ID}.verify.sh\`."
              echo
              echo "The gate script (the capsule's own DoD) passed, and this change was"
              echo "additionally critiqued by an LLM reviewer against the capsule's"
              echo "judgment criteria before shipping. $DUAL_NOTE"
              echo
              echo "$GATE_NOTE"
              echo
              echo "This PR is opened non-draft and is NOT auto-merged -- a human reviews"
              echo "the diff and the run evidence before merging."
              echo
              echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > "$BODY_FILE"
          else
            TITLE="implement: work-in-progress for #${ISSUE} (${CAPSULE_ID}) -- did not converge"
            {
              echo "## Implement-stage WORK-IN-PROGRESS for #${ISSUE} (did not converge)"
              echo
              echo "Refs #${ISSUE}. \`task-runner.dot\` (see \`.github/capsule-pipeline/\`) did"
              echo "NOT converge on this capsule within its budget; this branch salvages the"
              echo "committed work-in-progress so it is not lost. The judge's objections and"
              echo "the postmortem (if written) are in the workflow run's uploaded artifacts."
              echo
              echo "Do NOT read this PR as a proven fix: the gate/critique claims a converged"
              echo "run would carry do not apply here."
              echo
              echo "Measured classification: engine exit code \`${EXIT_RAW:-<absent>}\` (absent means the"
              echo "engine exited non-zero and the run step aborted before recording it), the"
              echo "pipeline's own recorded outcome \`${RECORDED_OUTCOME}\` (checkpoint.json)."
              echo
              echo "Where this branch's commits came from (issue #220): ${SALVAGE_NOTE}"
              echo
              echo "$GATE_NOTE"
              echo
              echo "This PR is opened non-draft and is NOT auto-merged -- a human reviews"
              echo "the diff and the run evidence before deciding whether to adopt, finish,"
              echo "or close this work."
              echo
              echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > "$BODY_FILE"
          fi

          url=$(gh pr create --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body-file "$BODY_FILE" \
            --base main --head "$BRANCH")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment on the issue with the outcome
        if: always() && steps.locate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMENT="$RUNNER_TEMP/capsule-implement/comment.md"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Same cross-checked classification the PR step used -- the exit
          # code alone cannot tell converged from crashed (see the "Classify
          # the run" step). Reading it here too keeps the issue comment and
          # the PR body from ever telling two different stories.
          CONVERGED="${{ steps.classify.outputs.converged }}"
          PR_URL="${{ steps.pr.outputs.url }}"

          # Three real outcomes, three honest messages. Run 31335891096
          # posted "no fix PR opened" while the SAME run's previous step had
          # just pushed a branch and opened PR #178 (non-convergence salvage
          # path) -- the old two-way template asserted a PR's absence it
          # never checked. Claim "no fix PR opened" only when none was.
          if [ "$CONVERGED" = "true" ] && [ -n "$PR_URL" ]; then
            {
              echo "**Implement stage: fix PR opened.**"
              echo
              echo "$PR_URL"
              echo
              echo "Workflow run: $RUN_URL"
            } > "$COMMENT"
          elif [ -n "$PR_URL" ]; then
            {
              echo "**Implement stage did not converge -- work-in-progress salvaged as $PR_URL.**"
              echo
              echo "task-runner.dot did not converge on a shipped fix within its iteration"
              echo "budget. The committed work-in-progress was salvaged as the PR above --"
              echo "it is NOT a proven fix; the judge's objections are in the run artifacts."
              echo "Postmortem (if written):"
              echo
              echo '```'
              cat "$GITHUB_WORKSPACE/.ai/postmortem/report.md" 2>/dev/null || echo "(no postmortem report was written)"
              echo '```'
              echo
              echo "Workflow run: $RUN_URL"
            } > "$COMMENT"
          else
            {
              echo "**Implement stage FAILED -- no fix PR opened.**"
              echo
              echo "task-runner.dot did not converge on a shipped fix within its"
              echo "iteration budget (or an error occurred opening the PR). Postmortem"
              echo "(if written):"
              echo
              echo '```'
              cat "$GITHUB_WORKSPACE/.ai/postmortem/report.md" 2>/dev/null || echo "(no postmortem report was written)"
              echo '```'
              echo
              echo "This is a real failure, not a transient CI hiccup -- see the workflow"
              echo "run for full logs and uploaded artifacts."
              echo
              echo "Workflow run: $RUN_URL"
            } > "$COMMENT"
          fi

          gh issue comment "${{ steps.locate.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body-file "$COMMENT"

      - name: "Residual secret gate: block the upload if anything secret-shaped remains"
        id: secret_gate
        # Defense in depth over the scrub step above: re-scan the evidence
        # roots (including files written AFTER the scrub, e.g. the PR body
        # and issue comment staged under $RUNNER_TEMP) with a detection set
        # deliberately BROADER than the scrub's redaction set (it adds a
        # high-entropy-token heuristic), so a secret shape the scrubber
        # doesn't know about never rides out in a public artifact. An
        # artifact with no evidence is safe; an artifact with a leaked key
        # is not -- fail toward not-uploading.
        #
        # THE VERDICT IS SPLIT BY FINDING CLASS (issue #206). This step ran
        # `scan` and blocked on ANY finding, and the measurement came back
        # 4 real runs out of 4: every one tripped the entropy heuristic on
        # legitimate worker-session payloads in
        # logs/*/sessions/*/events.jsonl -- digests, base64 fragments,
        # request ids (run 31657343281: findings at events.jsonl lines
        # 5/6/10/11/14, all shape=high-entropy-token). The evidence
        # artifact therefore NEVER survived a run, every run read red, and
        # a failed run could not be diagnosed at all. `gate` keeps the hard
        # block for every KNOWN credential shape -- the sk-/gh[posur]_/
        # github_pat_ prefixes, the end-anchored sensitive NAME=value
        # assignments, and the literal values of this job's own secrets --
        # and QUARANTINES entropy-only findings instead: it redacts those
        # spans in place as [REDACTED:entropy], RE-SCANS, and proceeds only
        # if that second pass is clean, annotating the job (::notice) with
        # the count and the file list. Nothing secret-shaped is uploaded
        # either way; the difference is that the old behavior shipped
        # NOTHING and lost the evidence, and this ships the evidence with
        # the suspicious spans removed. If the re-scan still finds
        # anything, the upload is blocked exactly as before.
        #
        # NO --never-redact FENCE IS NEEDED HERE, and that is a fact about
        # this lane, not an omission: the implement stage produces a FIX
        # BRANCH from the workspace git tree, not a capsule pair, so
        # $RUNNER_TEMP/capsule-implement holds only evidence (logs/, the
        # staged pr-body.md and comment.md). The specify workflows, whose
        # $RUNNER_TEMP/capsule-run DOES contain the capsule pair under
        # out/, pass --never-redact for it -- PR #207's rule that the pair
        # is scanned and never mutated. Should this lane ever stage a
        # to-be-pushed artifact under $RUNNER_TEMP, it must be fenced the
        # same way.
        if: always() && steps.locate.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAPSULE_PR_TOKEN: ${{ secrets.CAPSULE_PR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "upload_ok=false" >> "$GITHUB_OUTPUT"
          if python3 .github/capsule-pipeline/scrub_secrets.py gate \
              "$RUNNER_TEMP/capsule-implement" \
              "$GITHUB_WORKSPACE/.ai"; then
            echo "upload_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The residual secret gate BLOCKED the run-evidence artifact upload -- either a KNOWN credential shape was found in the evidence after scrubbing, or the entropy quarantine's confirming re-scan did not come back clean (see the scan findings above for file/line/shape; the secret values themselves are never printed). Nothing was uploaded. Rotate any credential the findings implicate before touching this run's evidence." >&2
            exit 1
          fi

      - name: Upload run evidence (logs, .ai state)
        # Gated: uploads ONLY when the residual secret gate above
        # affirmatively passed. If the gate found something, failed, or
        # never ran, upload_ok != 'true' and this step is skipped --
        # fail-closed by construction.
        if: always() && steps.secret_gate.outputs.upload_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: capsule-implement-issue-${{ steps.locate.outputs.issue_number }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/capsule-implement
            ${{ github.workspace }}/.ai
          if-no-files-found: warn

      - name: Fail the job on genuine non-convergence
        if: always() && steps.locate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Cross-checked, not exit-code-only (see "Classify the run"). The
          # old message printed "(exit=)" on run 31789137305 -- an empty
          # string where the reader expected a code -- because a non-zero
          # engine exit never reaches that output at all. Report both halves
          # of what was actually measured.
          EXIT="${{ steps.run.outputs.attractor_exit }}"
          RECORDED_OUTCOME="${{ steps.classify.outputs.recorded_outcome }}"
          if [ "${{ steps.classify.outputs.converged }}" != "true" ]; then
            echo "::error::task-runner.dot did not converge (engine exit='${EXIT:-<absent>}', pipeline's own recorded outcome='${RECORDED_OUTCOME}') -- see the postmortem comment posted on the issue and the uploaded run evidence." >&2
            exit 1
          fi
          if [ -z "${{ steps.pr.outputs.url }}" ]; then
            echo "::error::task-runner.dot reported success but no fix PR was opened -- see the 'Push fix branch and open PR' step's log." >&2
            exit 1
          fi
          echo "Implement stage concluded successfully: ${{ steps.pr.outputs.url }}"
